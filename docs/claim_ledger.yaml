- claim_id: C-THEORY
  claim_text: >
    The Lean 4 formalization proves that the actual (implemented) hard-Best-of-N selector/operator
    converges, giving the empirical selector a machine-checked theoretical guarantee.
  status: directional
  stage: 1
  artifact: proofs/tfrl/TfrlProofs/BestOfN.lean
  code_commit: 9e999f7
  metric_definition: null
  supersedes: null
  superseded_by: null
  invalid_reason: >
    The specific strong claim ("Lean has proven the actual implemented operator converges") is NOT
    established and must not be cited as such: the count of theorems directly linked to the
    engineering-side operator is 0. The core quantitative bound is imported, not proved in-repo: it
    cites Beirami et al. (2024), arXiv:2401.01879, Theorem 3.1, as a single named, opaque axiom
    (`beirami_thm_3_1`) rather than a derivation from more primitive Mathlib results. Downstream
    conclusions are additionally conditional on assumed monotonicity/decay terms (monotone/δ/τ/reach)
    that are external hypotheses, not derived facts. What remains directional/valid framing: the
    theory work correctly and honestly documents its own conditionality (sorry-count 0 is not the
    same claim as "system convergence proven"), and is useful as a scoped, hypothesis-generating
    formalization effort per Stage-1 status.
  adjudicated_on: 2026-07-11
  reviewer: "2026-07-10 forensic audit + 2026-07-11 delta verification"
  note: >
    G6 (theory/implementation-parity gate) status: operator-linked theorems = 0; no executable
    conformance test yet ties the Python selector to the Lean operator example-by-example. Treat any
    paper sentence of the form "Lean proves our selector converges" as unsupported until G6 closes.
    2026-07-12 addendum (RI item 2/3, 续15 naming-correction finding): count=0 remains AUTHORITATIVE
    and is unchanged by proofs/tfrl/TfrlProofs/Coverage.lean (module `TfrlProofs.Coverage`, added
    2026-07-11). That module provides i.i.d.-Bernoulli coverage-model lemmas (`missProb_eq_prod`,
    `missProb_antitone`, `missProb_strictAnti`, `missProb_le_of_N_ge`) for the best-of-N
    pool-generation loop, WITH code citations to the actual generation loop
    (scripts/repro_asr_best_of_n_v2.py lines 524-531) and an empirical bridge
    (scripts/coverage_bridge.py / _repro/coverage_bridge_v1.json) — but it formalizes the
    independent-DRAWS/sampling step feeding the selector, not a theorem about the reward-argmax
    SELECTION rule (klBoNActual) itself, so it is correctly NOT counted toward the operator-linked
    theorem count. The module's original docstring calling this "the FIRST operator-linked theorem"
    was a naming error and has been corrected (see the module docstring itself and
    wiki/Theory-Convergence-and-Constraints.md's T-coverage subsection, both retitled 2026-07-12).
    2026-07-27 capability-portfolio addendum: InfoBoundary is a fixed-pool read-out bound only;
    a finite-pool oracle miss does not establish an all-contexts ICL gap. RuntimeReliability adds
    conditional 2-epsilon margin lemmas for incumbent non-regression/strict improvement, but the
    uniform reward-error bound is an empirical hypothesis and the new lemmas remain unlinked to the
    implemented controller. Operator-linked theorem count therefore remains 0.

