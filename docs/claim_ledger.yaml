- claim_id: C-M3
  claim_text: >
    New-signal cross-modal injection realizes a robust +22.4% accuracy gain on vocalbench-zh, "locking"
    Q1b (an omni agentic/memory system is warranted as a new-signal injector).
  status: invalid
  stage: 1
  artifact: projects/speech-mllm-training-free-rl/_repro/m3_crossmodal.json
  code_commit: 1f4f3b3
  metric_definition: >
    Paired accuracy delta on vocalbench-zh, injected-signal arm vs. base arm, n=150 powered run.
  supersedes: null
  superseded_by: >
    wiki/2026-07-05-A-realization-conclusion.md (2026-07-05 owner retraction banner) and the
    subsequent clean-rerun record set: wiki/2026-07-07-E2-clean-cf-utilization.md and
    wiki/2026-07-07-E6-final-conclusions-clean.md (2026-07-04/07 clean reruns); see also
    wiki/2026-07-05-omni-multimodal-memory-design.md for the legitimate (non-leaking) reframing.
  invalid_reason: >
    Input leakage / information-boundary violation: the injected "new independent signal" was the
    TEST ITEM'S OWN ground-truth text transcript. At deployment the omni model's input is audio-only
    — a golden transcript does not exist, and if it did, an omni model would be unnecessary (a text
    LLM plus an ASR would suffice, which negates the point of an omni model). The +22.4% is the model
    reading the answer off a smuggled-in transcript, not a genuine cross-modal capability gain. This
    is the same error class as the earlier retracted acoustic-oracle result. Absolutely prohibited
    from citation as positive evidence (G3 leakage red-team gate).
  adjudicated_on: 2026-07-11
  reviewer: "2026-07-10 forensic audit + 2026-07-11 delta verification"

