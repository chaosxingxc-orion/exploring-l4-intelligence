# Machine-readable claim ledger (RI-G1)
#
# PURPOSE
#   This file is the SINGLE SOURCE OF TRUTH for whether any headline claim made anywhere in this
#   umbrella (or its four project repos) is currently citable as evidence. Any AI agent or human
#   MUST resolve a claim's validity from THIS FILE, not from prose in wiki/*.md, docs/*.md, commit
#   messages, or README files. Those documents may still contain stale positive language (frontmatter
#   `status:`/`verdict:` fields that predate a later retraction) — this ledger is the authoritative
#   status layer that overrides them. See wiki/2026-07-10-research-integrity-forensic-audit.md (the
#   forensic audit that produced gates RI-G0..G7) and wiki/2026-07-11-adversarial-review-of-stage1-audit-response.md
#   (the 2026-07-11 delta verification that adjudicated several entries below).
#
#   Rule of thumb for a consuming agent: look up the claim_id (or grep the artifact path), read
#   `status`. Only `status: valid` may be cited as confirmatory evidence without further caveats.
#   `directional` may be cited ONLY labeled as Stage-1 directional/hypothesis-grade, with the stated
#   scope. `null` and `unverified` must NOT be cited as positive evidence either way. `invalid` must
#   NEVER be cited as evidence for the claim_text as stated; check `superseded_by` for the corrected
#   successor claim/record, if any.
#
# SCHEMA (one list entry per claim)
#   claim_id:          stable short identifier, "C-<TOPIC>"
#   claim_text:        the claim as it was originally asserted (prose), for human matching
#   status:            valid | directional | "null" | invalid | unverified
#                        (status: "null" is the quoted STRING "null", one of the five enum values,
#                        meaning "tested, statistically null" — NOT YAML's null/None type. Other
#                        fields such as supersedes/superseded_by/invalid_reason use bare `null`
#                        (YAML None) to mean "not applicable / no value". Do not conflate the two.)
#                        valid       - confirmed, reproducible, may be cited as-is
#                        directional - Stage-1 hypothesis-grade signal only (CLAUDE.md three-stage
#                                      methodology); never confirmatory, scope-limited
#                        null        - tested, result is statistically indistinguishable from no
#                                      effect (CI crosses zero / spans null)
#                        invalid     - the claim as stated is false, mechanism-confounded, or rests
#                                      on an information-boundary violation; see invalid_reason
#                        unverified  - no artifact hash / independent check ties the number down, or
#                                      the specific claim was never actually tested
#   stage:             1 | 2 | 3   (CLAUDE.md research-methodology stage the evidence belongs to)
#   artifact:          repo-relative path(s) to the primary result artifact(s) backing the claim
#   code_commit:       git commit hash(es) (short) that produced the artifact / made the claim
#   metric_definition: what number is actually being computed (primary metric, condition, arm)
#   supersedes / superseded_by: claim_id or record (wiki page / artifact) this entry replaces or is
#                      replaced by, if any
#   invalid_reason:    why status is `invalid` (or the key caveat for `null`/`directional`/`unverified`)
#   adjudicated_on:    date this status was last ruled on
#   reviewer:          who/what performed the adjudication
#   note:              (optional, non-schema, human-context only) extra caveats that don't cleanly
#                      fit another field. Not required for machine resolution — status/invalid_reason
#                      already carry the load-bearing content.
#
# Provenance of this ledger: seeded 2026-07-11 per the signed RI-G0/RI-G1 remediation plan, from
# wiki/2026-07-10-research-integrity-forensic-audit.md §11/§15 and wiki/2026-07-11-adversarial-review-of-stage1-audit-response.md.
# Append-only in spirit: re-adjudicate by adding a new entry / updating status + adjudicated_on +
# reviewer, never by silently deleting a prior ruling.

